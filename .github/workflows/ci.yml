name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  orders-api:
    name: Orders API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U app -d app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: app
          RABBITMQ_DEFAULT_PASS: app
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_PORT: "8080"
      DATABASE_URL: postgres://app:app@localhost:5433/app?sslmode=disable
      JWT_SECRET: test-secret
      JWT_EXPIRES_IN: 1h
      RABBITMQ_URL: amqp://app:app@localhost:5672/

    defaults:
      run:
        working-directory: orders-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: orders-api/go.sum

      - name: Download Dependencies
        run: go mod download

      - name: Format Check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./... -count=1

      - name: Race Tests
        run: go test ./... -race -count=1

      - name: Build
        run: go build ./...

  product-service:
    name: Product Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: product
          POSTGRES_PASSWORD: product
          POSTGRES_DB: products
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U product -d products"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: app
          RABBITMQ_DEFAULT_PASS: app
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_PORT: "8081"
      DATABASE_URL: postgres://product:product@localhost:5434/products?sslmode=disable
      RABBITMQ_URL: amqp://app:app@localhost:5672/

    defaults:
      run:
        working-directory: product-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: product-service/go.sum

      - name: Download Dependencies
        run: go mod download

      - name: Format Check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./... -count=1

      - name: Race Tests
        run: go test ./... -race -count=1

      - name: Build
        run: go build ./...
